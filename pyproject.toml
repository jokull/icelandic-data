[project]
name = "hagstofan-data"
version = "0.1.0"
description = "Data processing for Icelandic statistics"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "polars>=1.0",
    "httpx>=0.27",
    "playwright>=1.40",
    "pdfplumber>=0.10",
    "iceaddr>=0.6.1",
    "fastexcel>=0.19.0",
    "beautifulsoup4>=4.14.3",
    "typer>=0.21.2",
    "duckdb>=1.1",
]

# Requirement tiers — see AGENTS.md "Requirement tiers". Core deps above are
# Tier 0 (plain Python, every OS). Groups below are opt-in tiers.
[dependency-groups]
dev = [
    "ipython>=8.0",
    "pytest>=8.0",
    "ruff==0.17.5",
]
# Tier 1 — maps: geospatial + raster + matplotlib (large wheels, all platforms)
maps = [
    "geopandas>=1.0",
    "matplotlib>=3.9",
    "rasterio>=1.3",
    "numpy>=1.26",
    "pyproj>=3.6",
    "shapely>=2.0",
    "psutil>=5.9",
]
# Tier 3 — pdf: AI table extraction (pulls in torch, ~2 GB)
pdf = [
    "docling>=2.74",
    "liteparse>=1.2",
]

[tool.pytest.ini_options]
addopts = ["-m", "not slow"]
markers = [
    "slow: marks tests that make network/browser calls",
    "health: upstream data-source health probe (auto-applied under tests/health/)",
    "degraded_ok: staleness check — reports degraded, does not fail the scheduled run",
]
testpaths = ["tests"]

# Lint: every selected rule is an error (CI fails); everything else is off.
# No warnings tier — if a rule isn't worth failing on, it isn't selected.
[tool.ruff]
target-version = "py312"
extend-exclude = ["data", "reports"]

[tool.ruff.lint]
select = [
    "E9",   # syntax errors
    "F",    # pyflakes: undefined names, unused imports/variables
    "B",    # bugbear: likely bugs
    "I",    # import order (autofix)
    "UP",   # pyupgrade (autofix)
]
ignore = [
    "B905", # zip() without strict= — noise for this codebase
    "B904", # raise-from inside except — style, not a bug
    "B008", # function call in default arg — typer/argparse idiom
]
