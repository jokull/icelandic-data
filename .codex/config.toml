# Codex / ChatGPT Desktop project config. Loaded once you mark this folder as trusted.
#
# Every script here calls a public Icelandic API, so the workspace-write sandbox
# needs outbound network. uv also needs a writable cache; the default one lives
# outside the workspace, so keep it inside the repo (.uv/ is gitignored).
[sandbox_workspace_write]
network_access = true

[shell_environment_policy.set]
UV_CACHE_DIR = ".uv/cache"

# Flettu (flettu.is) — cited annual-report figures, boards and owners for
# Icelandic companies. OAuth in the browser, no key: `codex mcp login flettu`.
# See the skatturinn skill.
[mcp_servers.flettu]
url = "https://flettu.is/api/mcp"
