name: Dashboard

# Fetches data/processed/dashboard.json (scripts/dashboard.py) and publishes it
# to GitHub Pages. Runs every 6 hours, matching the metrics' own update cadence
# (nothing here moves faster than daily fixings/rates).

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/dashboard.py
      - scripts/sedlabanki_fx.py
      - .github/workflows/dashboard.yml

concurrency:
  group: dashboard
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch:
    name: Fetch + commit dashboard.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch dashboard data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv run python scripts/dashboard.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/processed/dashboard.json; then
            echo "No change in dashboard.json — skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/processed/dashboard.json
            git commit -m "chore: update dashboard.json"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/processed

  deploy:
    name: Deploy to GitHub Pages
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
