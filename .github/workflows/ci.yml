name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Fast tests (${{ matrix.os }}, ${{ matrix.tier }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The toolkit is plain Python; this matrix is what backs that claim.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Tier 0 (core) must pass on its own; the maps tier is the heavy opt-in.
        # See AGENTS.md "Requirement tiers".
        tier: [core, maps]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked ${{ matrix.tier == 'maps' && '--group maps' || '' }}

      # Deselects the `slow` marker (network + browser), so this job never
      # depends on third-party service availability.
      - name: Check setup (imports, skills link)
        run: uv run python scripts/setup_check.py

      - name: Run tests
        run: uv run pytest -m "not slow"
